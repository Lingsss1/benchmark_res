[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "recevobench"
version = "0.1.0"
description = "A protocol-first benchmark for self-evolving recommender-system agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "RecEvoBench Contributors"}]
keywords = ["recommender-systems", "agents", "benchmark", "model-evolution"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "pytest-cov>=6", "ruff==0.16.6"]

[project.scripts]
recevobench = "recevobench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/recevobench/schemas" = ["schemas/*.json"]
"share/recevobench/tasks" = ["tasks/*.json"]
"share/recevobench/faults" = ["faults/*.json"]
"share/recevobench/seed/simple_rec" = ["seed/simple_rec/*.py"]
"share/recevobench/seed/simple_rec/config" = ["seed/simple_rec/config/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
branch = true
source = ["recevobench"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75
